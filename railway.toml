[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[env]
NODE_ENV = "production"
PORT = "3000"
HOST = "0.0.0.0"
ORIGIN = "https://packersly-production.up.railway.app"
PUBLIC_ORIGIN = "https://packersly-production.up.railway.app"
PROTOCOL_HEADER = "x-forwarded-proto"
HOST_HEADER = "x-forwarded-host"
